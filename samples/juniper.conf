# Sample Juniper Junos configuration - fully sanitized, fake secrets only
# Vendor: Juniper, OS: Junos
## Last commit: 2024-01-15
set system host-name JR1
set system services ssh
set system services ssh protocol-version v2
set system services http disable
set system services https
set snmp community PUBLIC_COMMUNITY_RO authorization read-only
set snmp community PRIVATE_COMMUNITY_RW authorization read-write
set system syslog host 10.0.0.5
set system ntp server 10.0.0.1
set system login message "AUTHORIZED ACCESS ONLY"
set system login password minimum-length 14
set system services ssh ciphers weak
