! Sample Cisco IOS configuration - fully sanitized, fake secrets only
! Vendor: Cisco, OS: IOS 15.2
hostname SW1
version 15.2
!
no ip telnet
ip ssh version 2
no ip http server
ip http secure-server
!
snmp-server community PUBLIC_COMMUNITY_RO version 2
snmp-server community PRIVATE_COMMUNITY_RW version 2
!
logging host 10.0.0.5
!
ntp server 10.0.0.1
!
line vty 0 4
 exec-timeout 10
 transport input ssh
!
banner login # AUTHORIZED ACCESS ONLY #
!
security passwords minimum-length 14
service password-encryption
!
